name: GA Reproducibility Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout controller with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Provision approved Microsoft JDK archive
        shell: bash
        run: |
          set -euo pipefail
          export JDK_ARCHIVE_NAME='microsoft-jdk-21.0.12-linux-x64.tar.gz'
          export JDK_ARCHIVE_URL='https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz'
          export JDK_CHECKSUM_URL='https://aka.ms/download-jdk/microsoft-jdk-21.0.12-linux-x64.tar.gz.sha256sum.txt'
          export JDK_EXPECTED_SHA256='f2a84ad31ebeaf3a26252dd86a4a8e1b74aefb6bfc8e55fd20190110d1353c0f'
          export JDK_ARCHIVE="$RUNNER_TEMP/$JDK_ARCHIVE_NAME"
          export JDK_CHECKSUM="$RUNNER_TEMP/$JDK_ARCHIVE_NAME.sha256sum.txt"
          export JDK_ROOT="$RUNNER_TEMP/microsoft-jdk-21.0.12"
          export GA_EVIDENCE_DIR="$RUNNER_TEMP/ga-evidence"
          test ! -e "$JDK_ROOT"
          mkdir -p "$JDK_ROOT" "$GA_EVIDENCE_DIR"
          curl --fail --silent --show-error --location --retry 2 "$JDK_CHECKSUM_URL" -o "$JDK_CHECKSUM"
          test "$(awk -v name="$JDK_ARCHIVE_NAME" '$2 == name {print $1}' "$JDK_CHECKSUM")" = "$JDK_EXPECTED_SHA256"
          curl --fail --silent --show-error --location --retry 2 "$JDK_ARCHIVE_URL" -o "$JDK_ARCHIVE"
          test "$(sha256sum "$JDK_ARCHIVE" | cut -d' ' -f1)" = "$JDK_EXPECTED_SHA256"
          sha256sum "$JDK_ARCHIVE" "$JDK_CHECKSUM" | tee "$GA_EVIDENCE_DIR/jdk-download-sha256sums.txt"
          tar -tzf "$JDK_ARCHIVE" | awk 'BEGIN { bad=0 } /^\// || /(^|\/)\.\.(\/|$)/ { bad=1 } END { exit bad }'
          tar -xzf "$JDK_ARCHIVE" -C "$JDK_ROOT"
          export JAVA_HOME="$(find "$JDK_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'jdk-*' -print -quit)"
          test -n "$JAVA_HOME" && test -x "$JAVA_HOME/bin/java" && test -x "$JAVA_HOME/bin/javac"
          export PATH="$JAVA_HOME/bin:$PATH"
          {
            printf 'jdk.vendor=Microsoft\n'
            printf 'jdk.version=21.0.12+8-LTS\n'
            printf 'jdk.platform=linux-x64\n'
            printf 'jdk.archiveFilename=%s\n' "$JDK_ARCHIVE_NAME"
            printf 'jdk.archiveSha256=%s\n' "$JDK_EXPECTED_SHA256"
            printf 'jdk.checksumSha256=%s\n' "$(sha256sum "$JDK_CHECKSUM" | cut -d' ' -f1)"
            printf 'jdk.javaHome=%s\n' "$JAVA_HOME"
          } | tee "$GA_EVIDENCE_DIR/jdk-runtime-identity.txt"
          java -version 2>&1 | tee "$GA_EVIDENCE_DIR/java-version.txt"
          javac -version 2>&1 | tee "$GA_EVIDENCE_DIR/javac-version.txt"
          grep -E '21\.0\.12|Microsoft' "$GA_EVIDENCE_DIR/java-version.txt"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"

      - name: Verify controller, candidate and toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga-evidence"
          mvn --version | tee "$RUNNER_TEMP/ga-evidence/maven-version.txt"
          grep -F 'Apache Maven 3.9.16' "$RUNNER_TEMP/ga-evidence/maven-version.txt"
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git cat-file -t refs/tags/v0.9.0-rc.1)" = tag
          test "$(git rev-parse refs/tags/v0.9.0-rc.1)" = \
            dfd38c08e80aed9035bf1c2d7c8faf8bae99c356
          test "$(git rev-parse 'refs/tags/v0.9.0-rc.1^{}')" = \
            e2828f563ee41316c062385c0244ac1336731359
          test "$(sha256sum docs/release/ga-security-toolchain-v1.properties | cut -d' ' -f1)" = \
            6abe66f22ac58b29a45287cf99402045f04b6e2d37fcdb1d144eef215b649397
          {
            printf 'controller.gitSha=%s\n' "$GITHUB_SHA"
            printf 'candidate.productionSha=%s\n' \
              e2828f563ee41316c062385c0244ac1336731359
            printf 'candidate.tagObjectSha=%s\n' \
              dfd38c08e80aed9035bf1c2d7c8faf8bae99c356
            printf 'candidate.sourceTreeSha256='
            git archive --format=tar e2828f563ee41316c062385c0244ac1336731359 | sha256sum | cut -d' ' -f1
          } | tee "$RUNNER_TEMP/ga-evidence/candidate.txt"

      - name: Build two detached candidate worktrees with isolated Maven repositories
        shell: bash
        run: |
          set -euo pipefail
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          export TZ=UTC
          export MAVEN_OPTS='-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Duser.timezone=UTC'
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct e2828f563ee41316c062385c0244ac1336731359)"
          export GA_BUILD_A="$RUNNER_TEMP/ga-build-a"
          export GA_BUILD_B="$RUNNER_TEMP/ga-build-b"
          test ! -e "$GA_BUILD_A"
          test ! -e "$GA_BUILD_B"
          mkdir -p "$GA_BUILD_A/m2" "$GA_BUILD_B/m2"
          git worktree add --detach "$GA_BUILD_A/source" \
            e2828f563ee41316c062385c0244ac1336731359
          git worktree add --detach "$GA_BUILD_B/source" \
            e2828f563ee41316c062385c0244ac1336731359
          trap 'git worktree remove --force "$GA_BUILD_A/source"; git worktree remove --force "$GA_BUILD_B/source"' EXIT
          mkdir -p "$RUNNER_TEMP/ga-evidence/build-a" "$RUNNER_TEMP/ga-evidence/build-b"
          (
            cd "$GA_BUILD_A/source"
            mvn -B -ntp -e -C -Dmaven.repo.local="$GA_BUILD_A/m2" \
              -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" \
              -pl core -am clean verify 2>&1 | tee "$RUNNER_TEMP/ga-evidence/build-a/maven.log"
          )
          (
            cd "$GA_BUILD_B/source"
            mvn -B -ntp -e -C -Dmaven.repo.local="$GA_BUILD_B/m2" \
              -Dproject.build.outputTimestamp="$SOURCE_DATE_EPOCH" \
              -pl core -am clean verify 2>&1 | tee "$RUNNER_TEMP/ga-evidence/build-b/maven.log"
          )
          test -z "$(git -C "$GA_BUILD_A/source" status --porcelain)"
          test -z "$(git -C "$GA_BUILD_B/source" status --porcelain)"
          test -f "$GA_BUILD_A/source/core/target/matching-engine-rc.jar"
          test -f "$GA_BUILD_B/source/core/target/matching-engine-rc.jar"
          cmp --silent "$GA_BUILD_A/source/core/target/matching-engine-rc.jar" \
            "$GA_BUILD_B/source/core/target/matching-engine-rc.jar"
          sha256sum "$GA_BUILD_A/source/core/target/matching-engine-rc.jar" \
            "$GA_BUILD_B/source/core/target/matching-engine-rc.jar" \
            | tee "$RUNNER_TEMP/ga-evidence/jar-sha256sums"
          (
            cd "$GA_BUILD_A/m2"
            find . -type f -printf '%P\n' | sort | while IFS= read -r item; do sha256sum "$item"; done
          ) > "$RUNNER_TEMP/ga-evidence/maven-a-inventory"
          (
            cd "$GA_BUILD_B/m2"
            find . -type f -printf '%P\n' | sort | while IFS= read -r item; do sha256sum "$item"; done
          ) > "$RUNNER_TEMP/ga-evidence/maven-b-inventory"
          export GA_EVIDENCE_FILE_LIST="$RUNNER_TEMP/ga-evidence-files.list"
          export GA_EVIDENCE_FILE_LIST_UNIQUE="$RUNNER_TEMP/ga-evidence-files.unique.list"
          export GA_EVIDENCE_SUMS_TMP="$RUNNER_TEMP/ga-evidence/SHA256SUMS.tmp"
          test -z "$(find "$RUNNER_TEMP/ga-evidence" -mindepth 1 -type l -print -quit)"
          test -z "$(find "$RUNNER_TEMP/ga-evidence" -mindepth 1 ! -type f ! -type d -print -quit)"
          find "$RUNNER_TEMP/ga-evidence" -type f -print0 |
            while IFS= read -r -d '' item; do
              rel="${item#"$RUNNER_TEMP/ga-evidence/"}"
              case "$rel" in
                ""|SHA256SUMS|SHA256SUMS.tmp|*.tmp|*/../*|../*|/*)
                  continue
                  ;;
              esac
              case "$rel" in
                *$'\n'*|*$'\r'*)
                  echo "invalid newline in evidence path" >&2
                  exit 1
                  ;;
              esac
              printf '%s\0' "$rel"
            done | LC_ALL=C sort -z > "$GA_EVIDENCE_FILE_LIST"
          test -s "$GA_EVIDENCE_FILE_LIST"
          LC_ALL=C sort -z -u "$GA_EVIDENCE_FILE_LIST" > "$GA_EVIDENCE_FILE_LIST_UNIQUE"
          cmp --silent "$GA_EVIDENCE_FILE_LIST" "$GA_EVIDENCE_FILE_LIST_UNIQUE"
          : > "$GA_EVIDENCE_SUMS_TMP"
          expected_count=0
          while IFS= read -r -d '' rel; do
            file="$RUNNER_TEMP/ga-evidence/$rel"
            test -f "$file" && test ! -L "$file"
            digest="$(sha256sum "$file" | cut -d' ' -f1)"
            printf '%s  %s\n' "$digest" "$rel" >> "$GA_EVIDENCE_SUMS_TMP"
            expected_count=$((expected_count + 1))
          done < "$GA_EVIDENCE_FILE_LIST"
          actual_count="$(wc -l < "$GA_EVIDENCE_SUMS_TMP")"
          test "$expected_count" = "$actual_count"
          (
            cd "$RUNNER_TEMP/ga-evidence"
            sha256sum --check --strict SHA256SUMS.tmp
          )
          mv -f "$GA_EVIDENCE_SUMS_TMP" "$RUNNER_TEMP/ga-evidence/SHA256SUMS"
          (
            cd "$RUNNER_TEMP/ga-evidence"
            sha256sum --check --strict SHA256SUMS
          )
